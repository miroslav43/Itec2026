name: itec_override
description: Real-time AR-like collaborative graffiti battle app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Image Processing
  camera: ^0.10.5+9
  image: ^4.1.3
  google_mlkit_barcode_scanning: ^0.12.0
  google_mlkit_text_recognition: ^0.13.1
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  socket_io_client: ^2.0.3+1
  http: ^1.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # UI Components
  flutter_colorpicker: ^1.0.3
  
  # Audio & Haptics
  audioplayers: ^5.2.1
  file_picker: ^8.0.5
  
  # 3D Map viewer
  model_viewer_plus: ^1.7.2

  # Utilities
  uuid: ^4.2.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/posters/
    - assets/sounds/
    - assets/images/
    - assets/fonts/
    - assets/map/
